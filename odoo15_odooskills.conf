[options]
; ═══════════════════════════════════════════════════════════════
; CONFIGURATION ODOO 15 — OdooSkills (personnel — modules oski_*)
; Bases visibles : o15_odooskills_*, odooskills_dev15, odooskills_test15
; ═══════════════════════════════════════════════════════════════

admin_passwd = St@odoodev
db_host = False
db_port = False
db_user = stadev
db_password = St@dev

; Addons : core Odoo 15 + modules OdooSkills (branche 15.0)
; PAS de modules ADICOPS clients (séparation perso/pro stricte)
addons_path =
	/home/stadev/odoo15-dev/addons,
	/home/stadev/odoo15-dev/content/apps/free,
	/home/stadev/odoo15-dev/content/apps/pro,
	/home/stadev/odoo15-dev/adi_third_party/adi_third_party2

xmlrpc_port = 8115
dbfilter = ^(o15_odooskills_|odooskills_dev15|odooskills_test15)

; Notes :
; - Switch avec odoo15.conf (même port 8115, addons ADICOPS) via IDE PyCharm
; - Pour porter un module v19 → v15, voir skill .claude/skills/odoo-version-porting
; - Test typique : ./odoo-bin -c odoo15_odooskills.conf -d o15_odooskills_test_oski_X --init=oski_X --stop-after-init
